<meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>PharmaNex</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6f8;--c:#fff;--t:#17212b;--m:#5f6b7a;--a:#0f766e;--ab:#e2f3f0;--r:#b42318;--rb:#fdeceb;--o:#a35a00;--ob:#fff2dd;--l:#d8dee6;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--c:#18202a;--t:#e6ebf1;--m:#9aa7b5;--a:#34d1bf;--ab:#12332f;--r:#ff8a80;--rb:#3a1a18;--o:#ffb454;--ob:#38280f;--l:#2a3441;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--c:#18202a;--t:#e6ebf1;--m:#9aa7b5;--a:#34d1bf;--ab:#12332f;--r:#ff8a80;--rb:#3a1a18;--o:#ffb454;--ob:#38280f;--l:#2a3441;color-scheme:dark}
html{background:var(--bg)}body{min-height:100vh;margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--c)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);padding:10px 14px;border-bottom:1px solid var(--l);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
nav,.sub{display:flex;gap:6px;padding:8px 14px;overflow-x:auto}
main{padding:0 14px 40vh;max-width:720px;margin:auto}
button,input,select,a{font:inherit}
button,a{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:8px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
button.on{background:var(--a);color:#fff;border-color:var(--a)}
button:disabled{opacity:.5}
input,select{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:8px;padding:8px;width:100%;margin:8px 0}
input[type=checkbox]{width:auto;margin:0}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin:8px 0}
.sel{border-color:var(--a)}
.m{color:var(--m);font-size:13px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.r input{margin:0}.r select{width:auto;margin:0}
.b{display:inline-block;font-size:12px;border-radius:99px;padding:2px 8px;margin:2px 2px 0 0}
.br{background:var(--rb);color:var(--r)}.bo{background:var(--ob);color:var(--o)}.bg{background:var(--ab);color:var(--a)}
.ok{color:var(--a);font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kp div{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:10px}
.kp b{display:block;font-size:14px}
.bar{display:grid;grid-template-columns:9rem 1fr 2rem;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bar i{height:8px;background:var(--a);border-radius:4px}
h4{margin:16px 0 4px}
