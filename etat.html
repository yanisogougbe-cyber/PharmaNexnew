<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PharmaNex — contrôle de l’installation</title>
<style>body{margin:0;font:16px/1.45 system-ui,sans-serif;background:#f4f6f8;color:#17212b;padding:16px;max-width:560px;margin:auto}h1{font-size:20px}
.r{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:10px 12px;margin:8px 0}.ok{border-left:5px solid #0f766e}.ko{border-left:5px solid #b42318}.nt{border-left:5px solid #a35a00}
b{display:block}small{color:#5f6b7a}button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #0f766e;background:#0f766e;color:#fff;margin:6px 6px 0 0}button.s{background:#fff;color:#0f766e}</style></head><body>
<h1>Contrôle de l’installation</h1><small>Cette page vérifie votre déploiement. Si une ligne est rouge, lisez la consigne.</small><div id="o"></div>
<div><button id="ib" hidden>Installer l’application</button><button class="s" id="rs">Vider le cache et recharger</button><button class="s" id="rg">Enregistrer le service worker</button></div>
<script>
const o=document.getElementById('o');let ev=null;
const L=(c,t,d)=>{const e=document.createElement('div');e.className='r '+c;e.innerHTML='<b>'+t+'</b><small>'+(d||'')+'</small>';o.appendChild(e)};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;document.getElementById('ib').hidden=false;L('ok','Chrome propose l’installation','Touchez « Installer l’application » ci-dessous.')});
document.getElementById('ib').onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null};
document.getElementById('rs').onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistrations();for(const x of r)await x.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()};
document.getElementById('rg').onclick=async()=>{try{await navigator.serviceWorker.register('sw.js');location.reload()}catch(e){alert('Échec : '+e.message)}};
(async()=>{
 const https=location.protocol==='https:'||location.hostname==='localhost';
 L(https?'ok':'ko','Adresse sécurisée (HTTPS)',https?location.origin+location.pathname:'Ouvrez le site avec l’adresse en https:// (GitHub Pages ou Netlify), pas depuis un fichier.');
 L(matchMedia('(display-mode: standalone)').matches?'ok':'nt','Mode d’affichage',matchMedia('(display-mode: standalone)').matches?'Vous êtes dans l’application installée (plein écran).':'Vous êtes dans le navigateur : c’est normal avant l’installation.');
 try{const r=await fetch('index.html',{cache:'no-store'});const t=await r.text();
  const v=(t.match(/name="x-version" content="([^"]+)"/)||[])[1];
  L(v?'ok':'ko','Version du site',v?('Version '+v+' en ligne.'):'Ancienne version en ligne : les nouveaux fichiers ne sont pas encore servis. Vérifiez qu’index.html du dossier est à la racine du dépôt, patientez 2 à 10 minutes, ou relancez le déploiement.');
  L(/100svh/.test(t)?'ok':'ko','Fond fixe (correctif)',/100svh/.test(t)?'Présent.':'Absent : c’est l’ancienne version qui est servie.');
  L(/rel="manifest"/.test(t)?'ok':'ko','Lien vers le manifeste dans index.html',/rel="manifest"/.test(t)?'Présent.':'Absent : ancienne version.')
 }catch(e){L('ko','index.html introuvable',e.message)}
 try{const r=await fetch('manifest.webmanifest',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const m=await r.json();
  L('ok','Manifeste trouvé','Nom : '+m.name+' · affichage : '+m.display+' · '+(m.icons||[]).length+' icônes.');
  for(const i of m.icons||[]){try{const x=await fetch(i.src,{cache:'no-store'});L(x.ok?'ok':'ko','Icône '+i.sizes+(i.purpose==='maskable'?' (adaptative)':''),x.ok?'Trouvée.':'Introuvable : le dossier icons doit être téléversé avec ses fichiers ('+i.src+').')}catch(e){L('ko','Icône '+i.sizes,i.src+' introuvable')}}
 }catch(e){L('ko','Manifeste introuvable','manifest.webmanifest doit être à la racine, à côté d’index.html. '+e.message)}
 try{const x=await fetch('sw.js',{cache:'no-store'});L(x.ok?'ok':'ko','Fichier sw.js',x.ok?'Trouvé.':'Introuvable (HTTP '+x.status+').')}catch(e){L('ko','Fichier sw.js','Introuvable.')}
 if('serviceWorker' in navigator){const g=await navigator.serviceWorker.getRegistration();L(g?'ok':'nt','Service worker',g?(navigator.serviceWorker.controller?'Actif et en contrôle.':'Enregistré ; rechargez la page une fois.'):'Pas encore enregistré : ouvrez la page d’accueil du site une fois, ou touchez « Enregistrer le service worker ».')}
 else L('ko','Service worker','Non pris en charge par ce navigateur.');
 setTimeout(()=>{if(!ev)L('nt','Chrome ne propose pas encore l’installation','Si tout est vert : ouvrez la page d’accueil, patientez quelques secondes, puis menu ⋮ > « Installer l’application ». Si l’appli est déjà installée ou a été refusée plusieurs fois, Chrome peut la masquer : supprimez l’ancien raccourci puis réessayez.')},2500);
})();
</script></body></html>
